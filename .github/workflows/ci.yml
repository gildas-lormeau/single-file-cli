name: Run tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      -
        name: Checkout sources
        uses: actions/checkout@v4
      -
        name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      -
        name: Install dependencies
        run: npm ci
      -
        name: Run linter
        run: npm run lint
      -
        name: Run tests
        run: npm test
