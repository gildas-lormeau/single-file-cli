name: Run tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      -
        name: Checkout sources
        uses: actions/checkout@v7
      -
        name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      -
        name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      -
        name: Install dependencies
        run: npm ci
      -
        name: Run linter
        run: npm run lint
      # Ubuntu denies user namespaces to a program without an AppArmor profile, and the Chromium of
      # the runner has none: it exits with "No usable sandbox!" (measured in run 44365817342). Every
      # launch of the suite would then fall back to --no-sandbox, and the default launch, with the
      # sandbox, would never be tested here. test/e2e/sandbox-fallback.test.js fails when it is not.
      -
        name: Allow the browser to set up its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The first launch of the browser on a runner takes from 3 to 35 seconds, and the test files that
      # run first all paid for it at once, inside their own time limits. One capture before the suite
      # moves that cost out of the tests. A failure here is not the suite's verdict.
      -
        name: Launch the browser once
        run: node single-file-node.js about:blank --dump-content > /dev/null || true
      -
        name: Run tests
        run: npm test

  # The suite runs on Linux, and what differs on Windows went unseen: in 2.27.1, the check that
  # recognizes the launched browser compared its profile switch with a command line that Chromium
  # quotes on Windows only, and every launch failed there. This job launches the browser for real on
  # Windows and runs the tests that need no browser. The whole suite is not run: it was not written
  # for Windows.
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      -
        name: Checkout sources
        uses: actions/checkout@v7
      -
        name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      -
        name: Install dependencies
        run: npm ci
      -
        name: Capture a page
        shell: bash
        run: |
          node single-file-node.js "data:text/html,<title>launch check</title>" --dump-content > page.html
          grep -q "<title>launch check</title>" page.html
      -
        name: Run unit tests
        shell: bash
        run: node --test "test/unit/*.test.js"

  # lib/ holds generated code that is committed, so nothing at runtime notices when it falls behind
  # the core release it was built from — a stale bundle just silently runs old code, and a dev build
  # (build-dev.sh, unminified, built from a local core checkout) silently replaces the released one.
  # build.sh is reproducible: it pins both the core package and esbuild, so rebuilding here and
  # diffing catches either case before it ships.
  build-output:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      -
        name: Checkout sources
        uses: actions/checkout@v7
      -
        name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      -
        name: Rebuild the released artifacts
        run: bash build.sh
      -
        name: Check lib/ matches the pinned core release
        run: git diff --exit-code --stat -- lib/
